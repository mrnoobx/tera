name: TeraBox Manual Cookie Extractor

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  extract_cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install axios qs

      - name: Extract TeraBox Cookie
        run: |
          node ./terabox-login.js "${{ secrets.TERABOX_USERNAME }}" "${{ secrets.TERABOX_PASSWORD }}" > cookie.json

      - name: Show cookie in logs (safe copy)
        run: |
          echo "===== COOKIE JSON OUTPUT ====="
          cat cookie.json
