name: TeraBox Login Cookie Extraction

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC

jobs:
  extract_cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install axios qs

      - name: Extract TeraBox Login Cookie
        id: extract_cookie
        run: |
          node ./terabox-login.js ${{ secrets.TERABOX_USERNAME }} ${{ secrets.TERABOX_PASSWORD }} > terabox_cookie.json

      - name: Output cookie JSON
        run: |
          cat terabox_cookie.json

      - name: Commit and push extracted cookie (optional)
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add terabox_cookie.json
          git commit -m "Add extracted TeraBox cookie"
          git push
          
